# Huge SE — 32-bit Mac SE with PMMU, 32MB RAM
# Boot: big-se ROM + PMMU IS=8 (24-bit virtual, Mac II style)
# PMMU maps virtual $800000 → physical $40800000 (ROM)
# PMMU maps virtual $7Fxxxx → physical $01FFxxxx (WTC video)
# After MODE32: switch to IS=0 identity + huge-se ROM

cpu 68030
loopcycles 300
platform mac68k

setvar sysrom_pos 0x40800000

# Big-se patched ROM: addresses in 24-bit range ($800000 base)
# PMMU translates virtual $800000 → physical $40800000
map type=rom address=0x40800000 size=512K file=huge-se/se-rom-huge.bin id=sysrom
# Bulk RAM: plain fast Pi RAM ($0 .. $01FF0000 = 32MB - 64KB). Fast inline writes.
map type=ram address=0x0 size=32704K id=sysram
# Top 64KB: write-through-cache to the SE bus. Writes mirror to the SE's top-of-RAM
# video/sound buffer ($3F0000). A relocating WTC = its SE-bus target ($3F0000) is a
# different address than the region itself ($01FF0000), declared via `sebus`.
map type=wtcram address=0x01FF0000 size=64K sebus=0x3F0000 id=vidram

# I/O slow-bus delay region (VIA)
map type=slowio address=0xEFE000 size=8K id=via

# SE-bus I/O remap window (hugeSE): the patched-32-bit-clean ROM hits all I/O
# in the $40 region; this translates physical $40xxxxxx -> SE bus (subtract
# $40000000) underneath the core. Explicit affine remap, NOT a width mask, so a
# 68020 board is just a different window. (ordinary SE: none; bigSE: $88->$58.)
iomap 0x40000000 0x41000000 0x0

setvar vnc 5900

# TEMP: RAM-buffered trace, ARMED by the $A0FD paravirt trap in the boot32
# trampoline (right after the RAM test). Captures the post-RAM-test boot -> SCSI
# -> stall WITHOUT the 100M-instruction RAM test. RAM-buffer (no SD I/O) should be
# light enough (~ns vs the GPIO poll's ~us) to NOT wedge the BlueSCSI. Trace ->
# /home/jas/trace.txt at exit. Comment out to disable.
#setvar trace_all 1

# REQUIRED: emulator-side figment trap intercept. Without this, the A-line
# dispatch is left half-configured through the ROM's RAM-sizing phase and
# the first figment trap ($A019 InitZone) wild-jumps → Sad Mac F/3.
setvar figment 1

# Patch the loaded 'gusd' gestalt resource in RAM to the 32-bit methods
# (machine 5/9 -> $0005). Volume-independent sibling of bigSE's fake_gusd:
# works even when the boot volume's gusd is the stock/compressed one (only
# one MacPack clone has the 2026-06-18 on-disk patch). Without a 32-bit
# method the System runs 24-bit-dirty pointers -> hang after Welcome.
setvar patch_gusd 1

# MODE32 pseudovirt trap ($A0FF) for the IS=8 → IS=0 32-bit switch.
# Re-enable when resuming the MODE32 milestone; known-good boot path
# (May 27 deep System 7.5 boot) ran without it.
#setvar mode32 1
