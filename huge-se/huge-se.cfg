# Huge SE — 32-bit Mac SE with PMMU, 32MB RAM
# SE ROM relocated to $40800000 (32-bit space)
# All I/O under $40xxxxxx (Mac II convention)

cpu 68030
loopcycles 300
platform mac68k

setvar sysrom_pos 0x40800000

map type=rom address=0x40800000 size=512K file=huge-se/se-rom-huge.bin id=sysrom
map type=wtcram address=0x0 size=32M id=sysram

# I/O at real 24-bit SE bus addresses (slow-path masks $40xxxxxx → 24-bit)
map type=slowio address=0xEFE000 size=8K id=via

# SCSI/IWM handled by custom_read/write (catches $580000-$5FFFFF after mask)

setvar vnc 5900
