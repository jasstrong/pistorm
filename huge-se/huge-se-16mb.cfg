# Huge SE — born-32 Mac SE with PMMU, 16MB RAM (24-bit-CLEAN BOUNDARY TEST)
#
# 16MB ($01000000) is the LARGEST born-32 RAM size where every byte of RAM sits
# at a 24-bit-clean address ($000000-$00FFFFFF).  No buffer the OS hands the ROM
# Device Manager can land above the 16MB line.  If hugeSE boots past the mount
# here but not at 32MB, the DM chokes on >16MB (24-bit-dirty) buffer addresses.
# Sized consistently from boot32.h BOOT32_MEMTOP=0x01000000 (-> se-rom-huge-16mb.bin):
#   sysram $0..$00FFA000 (16MB-24KB), vidram (WTC) at $00FFA000 -> MemTop $01000000
#   PMMU tables at $00FE0000, ScrnBase $00FFA700 (all derived from BOOT32_MEMTOP)
# The WTC covers ONLY the video+sound buffers (ScrnBase $00FFA700 .. MemTop); the
# ~40KB below it ($00FF0000..$00FFA000) is plain RAM that holds the born-32 boot
# stack (SP set to the WTC base at the $48 seam) so stack pushes never mirror to
# the SE bus.  Was a "convenient" 64KB WTC; the BBU only needs to see the buffers.
# The emulator derives its MemTop force from the vidram map top below, so one
# emulator binary drives the 32MB, 16MB and 8MB configs.

cpu 68030
loopcycles 300
platform mac68k

setvar sysrom_pos 0x40800000

# 16MB born-32 ROM (patch-rom.py built with BOOT32_MEMTOP=0x01000000)
map type=rom address=0x40800000 size=512K file=huge-se/se-rom-huge-16mb.bin id=sysrom
# Bulk RAM: plain fast Pi RAM ($0 .. $00FFA000 = 16MB - 24KB). Fast inline writes.
# The top 40KB of this ($00FF0000..$00FFA000) is the born-32 boot stack area — plain
# RAM, NOT mirrored to the SE bus (the BBU doesn't need to see the stack).
map type=ram address=0x0 size=16360K id=sysram
# Top 24KB: write-through-cache to the SE bus — the video+sound buffers only.
# Writes mirror to the SE's top-of-RAM buffer: CPU $00FFA000 -> SE-bus $3FA000, so
# ScrnBase $00FFA700 -> $3FA700 and SoundBase $00FFFD00 -> $3FFD00 (linear, via sebus).
map type=wtcram address=0x00FFA000 size=24K sebus=0x3FA000 id=vidram

# I/O slow-bus delay region (VIA)
map type=slowio address=0xEFE000 size=8K id=via

# SE-bus I/O remap window (hugeSE): physical $40xxxxxx -> SE bus (subtract $40000000).
iomap 0x40000000 0x41000000 0x0

setvar vnc 5900

# RAM-buffered trace, ARMED by the $A0FD paravirt trap after the RAM test.
#setvar trace_all 1

# REQUIRED: emulator-side figment trap intercept.
setvar figment 1

# Patch the loaded 'gusd' gestalt resource in RAM to the 32-bit methods.
setvar patch_gusd 1

# MODE32 pseudovirt trap — off (known-good born-32 path runs without it).
#setvar mode32 1
