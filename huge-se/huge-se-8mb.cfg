# Huge SE — born-32 Mac SE with PMMU, 8MB RAM (CONFIGURABLE-SIZE TEST VARIANT)
#
# Identical to huge-se.cfg except the born-32 RAM size is 8MB instead of 32MB,
# to test whether the ROM Device Manager / mount code chokes on an OS-visible
# MemTop above the 24-bit 16MB line.  Everything is sized consistently:
#   boot32.h BOOT32_MEMTOP = 0x00800000  -> se-rom-huge-8mb.bin (built with it)
#   sysram $0..$7F0000 (8MB-64KB), vidram (WTC) at $7F0000 -> MemTop $800000
#   PMMU tables at $7E0000, ScrnBase $7FA700 (all derived from BOOT32_MEMTOP)
# The emulator derives its MemTop force from the vidram map top below, so the
# same emulator binary drives both the 32MB and 8MB configs.

cpu 68030
loopcycles 300
platform mac68k

setvar sysrom_pos 0x40800000

# 8MB born-32 ROM (patch-rom.py built with BOOT32_MEMTOP=0x00800000)
map type=rom address=0x40800000 size=512K file=huge-se/se-rom-huge-8mb.bin id=sysrom
# Bulk RAM: plain fast Pi RAM ($0 .. $007F0000 = 8MB - 64KB). Fast inline writes.
map type=ram address=0x0 size=8128K id=sysram
# Top 64KB: write-through-cache to the SE bus. Writes mirror to the SE's top-of-RAM
# video/sound buffer ($3F0000). Region ($7F0000) differs from its SE-bus target
# ($3F0000), declared via `sebus`.
map type=wtcram address=0x007F0000 size=64K sebus=0x3F0000 id=vidram

# I/O slow-bus delay region (VIA)
map type=slowio address=0xEFE000 size=8K id=via

# SE-bus I/O remap window (hugeSE): physical $40xxxxxx -> SE bus (subtract $40000000).
iomap 0x40000000 0x41000000 0x0

setvar vnc 5900

# RAM-buffered trace, ARMED by the $A0FD paravirt trap after the RAM test.
#setvar trace_all 1

# REQUIRED: emulator-side figment trap intercept.
setvar figment 1

# Patch the loaded 'gusd' gestalt resource in RAM to the 32-bit methods.
setvar patch_gusd 1

# MODE32 pseudovirt trap — off (known-good born-32 path runs without it).
#setvar mode32 1
