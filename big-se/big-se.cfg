# Big SE — SE ROM relocated to $800000 for 8MB RAM

cpu 68030_24
loopcycles 300
platform mac68k

# OVL: ROM is at $800000
setvar sysrom_pos 0x800000

# ROM at $800000 (relocated from $400000)
map type=rom address=0x800000 size=512K file=big-se/se-rom-big.bin id=sysrom

# 8MB RAM as a single plain region (VNC works; MemTop=$800000, ScrnBase=$7FA700).
# NOTE: a separate `vidram` WTC region does NOT work for bigSE's PHYSICAL CRT: the
# stock SE RAM test excludes write-through RAM from MemTop (confirmed 2026-07-11 — a
# 64KB WTC region dropped ScrnBase to $7EA700, a 128KB one to $7DA700, i.e. MemTop =
# WTC-region-start), so the System's screen always lands just BELOW the mirror and
# only the ROM's early Happy Mac reaches the CRT. hugeSE avoids this only because its
# RAM test is patched to count the full 32MB including its vidram. Fixing bigSE's CRT
# needs a code-side mirror of the $7F0000 video sub-range from the plain RAM write
# path (no separate RAM range), not a config split.
map type=wtcram address=0x0 size=8M id=sysram

# Slow IO
map type=slowio address=0xEFE000 size=8K id=via

# SE-bus I/O remap window (bigSE): SCSI $880000->$580000 and IWM $8FF000->$5FF000
# both fall in this window (bus = $580000 + (addr - $880000)).
iomap 0x880000 0x900000 0x580000

# Runtime fake-revert the on-disk 'gusd' gestalt patch: the disk says machine
# 5/9 -> $0005 (32-bit IIci method, needed by hugeSE), which hangs 24-bit bigSE.
# Substitute the original SE/SE-30 methods ($0002/$0003) as 'gusd' streams off
# SCSI, so the disk stays untouched. (hugeSE does NOT set this.)
setvar fake_gusd 1

# Video at $7F0000 handled in platform code (translates → $3F0000 on SE bus)

# VNC
setvar vnc 5900

# TEMP: trace bigSE SCSI path to compare vs hugeSE.
# DISABLED 2026-07-11: the instruction tracer WEDGES the BlueSCSI (breaks the
# real-HW SCSI handshake mid-transfer; the wedge persists until power-cycle).
# Use only the always-on [GPIO-WR]/[SCSI-DISPATCH] probes on the SCSI phase.
#setvar trace_all 1
