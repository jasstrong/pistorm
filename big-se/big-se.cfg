# Big SE — SE ROM with 8MB RAM
# ROM relocated to $800000, SCSI relocated to $880000
# $400000-$7FFFFF is poison (catches unpatched ROM references)

cpu 68000
loopcycles 300
platform mac68k

# OVL: ROM is at $800000 (must be after platform line)
setvar sysrom_pos 0x800000

# ROM at $800000 (was $400000)
map type=rom address=0x800000 size=512K file=big-se/se-rom-big.bin id=sysrom

# 4MB RAM at $0 (real usable RAM)
map type=wtcram address=0x0 size=4M id=sysram

# Poison zone $400000-$7FFFFF — filled with ILLEGAL ($4AFC)
# Catches unpatched references to old ROM ($4xxxxx) and old SCSI ($58xxxx)
map type=rom address=0x400000 size=4M file=big-se/poison.bin id=poison

# Slow IO
map type=slowio address=0xEFE000 size=8K id=via

# SCSI at $880000 handled in platform code (translates → $580000 on SE bus)

# VNC remote display
setvar vnc 5900
